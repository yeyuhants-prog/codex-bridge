<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Bridge</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-left">
        <img src="/logo.png" alt="Codex Bridge" class="logo" />
        <div class="hero-text">
          <div class="title-row">
            <h1>Codex Bridge</h1>
            <span id="status-pill" class="status-pill loading">检测中…</span>
          </div>
          <p id="codex-meta" class="subtitle">正在读取本机 Codex 环境与模型列表</p>
        </div>
      </div>
      <button id="btn-refresh" type="button" class="icon-btn" title="刷新模型与状态">↻</button>
    </header>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <main class="content">
      <!-- Model Picker -->
      <section class="card">
        <div class="card-head">
          <label for="model-select" class="card-title">Codex 干活模型</label>
          <span id="model-default-hint" class="hint"></span>
        </div>
        <select id="model-select" class="select"></select>
        <p id="model-desc" class="helper"></p>
      </section>

      <!-- Reasoning Effort -->
      <section class="card">
        <div class="card-head">
          <span class="card-title">思考深度（Reasoning Effort）</span>
          <span id="effort-hint" class="hint"></span>
        </div>
        <div id="effort-group" class="pill-grid" role="radiogroup" aria-label="思考深度"></div>
        <p id="effort-desc" class="helper"></p>
      </section>

      <!-- Sandbox Mode -->
      <section class="card">
        <div class="card-head">
          <span class="card-title">执行权限（Sandbox）</span>
        </div>
        <div id="sandbox-group" class="segment-row" role="radiogroup" aria-label="沙箱权限">
          <button type="button" class="seg-btn" data-sandbox="read-only">
            <span class="seg-label">只读分析</span>
            <span class="seg-sub">read-only</span>
          </button>
          <button type="button" class="seg-btn" data-sandbox="workspace-write">
            <span class="seg-label">工作区可写</span>
            <span class="seg-sub">workspace-write</span>
          </button>
          <button type="button" class="seg-btn" data-sandbox="danger-full-access">
            <span class="seg-label">完全权限</span>
            <span class="seg-sub">full-access</span>
          </button>
        </div>
      </section>

      <!-- Collaboration Workflow -->
      <section class="card">
        <div class="card-head">
          <span class="card-title">协作方式（反重力 → Codex）</span>
        </div>
        <div id="workflow-group" class="segment-row two-col" role="radiogroup" aria-label="协作方式">
          <button type="button" class="seg-btn" data-workflow="direct">
            <span class="seg-label">直接派活执行</span>
            <span class="seg-sub">反重力拆解后直接让 Codex 落地</span>
          </button>
          <button type="button" class="seg-btn" data-workflow="plan_first">
            <span class="seg-label">先出任务单再执行</span>
            <span class="seg-sub">先输出详细要求，你确认后再跑</span>
          </button>
        </div>
        <div class="toggle-row">
          <label class="switch-label">
            <input id="toggle-ephemeral" type="checkbox" />
            <span>临时会话模式（不写入 Codex 历史会话）</span>
          </label>
        </div>
      </section>

      <!-- Quick Dispatch -->
      <section class="card">
        <div class="card-head">
          <span class="card-title">快捷指令</span>
          <button id="btn-reset" type="button" class="link-btn">恢复默认</button>
        </div>
        <div class="quick-input-row">
          <textarea id="quick-task" rows="2" class="textarea" placeholder="输入你想让反重力整理并派给 Codex 的任务，点击下方按钮发回当前对话…"></textarea>
        </div>
        <div class="action-row">
          <button id="btn-send-task" type="button" class="primary-btn">发给反重力去指挥 Codex</button>
          <button id="btn-check-status" type="button" class="secondary-btn">在对话中自检</button>
        </div>
      </section>

      <!-- Recent History -->
      <section class="card">
        <div class="card-head">
          <span class="card-title">最近 Codex 执行记录</span>
          <span id="history-count" class="hint">0 条</span>
        </div>
        <div id="history-list" class="history-list">
          <div class="empty">还没有执行记录，派 Codex 干一单后会显示在这里～</div>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
