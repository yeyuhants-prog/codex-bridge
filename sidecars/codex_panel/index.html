<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Bridge</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-left">
        <img src="/logo.png" alt="Codex Bridge" class="logo" />
        <div class="hero-text">
          <div class="title-row">
            <h1>Codex Bridge</h1>
            <span id="status-pill" class="status-pill loading" data-i18n="statusChecking">检测中…</span>
          </div>
          <p id="codex-meta" class="subtitle" data-i18n="loadingMeta">正在读取本机 Codex 环境与模型列表</p>
        </div>
      </div>
      <div class="hero-actions">
        <button id="btn-lang" type="button" class="lang-btn" title="Switch language / 切换中英文">EN</button>
        <button id="btn-refresh" type="button" class="icon-btn" title="刷新状态、模型与目标">↻</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="control" data-i18n="tabControl">控制台</button>
      <button type="button" class="tab" data-tab="goals">
        <span data-i18n="tabGoals">目标与任务</span>
        <span id="tab-badge" class="tab-badge hidden">0</span>
      </button>
    </nav>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <!-- TAB 1: CONTROL PANEL -->
    <main id="panel-control" class="content">
      <!-- Model Picker -->
      <section class="card">
        <div class="card-head">
          <label for="model-select" class="card-title" data-i18n="modelTitle">Codex 干活模型</label>
          <span id="model-default-hint" class="hint"></span>
        </div>
        <select id="model-select" class="select"></select>
        <p id="model-desc" class="helper"></p>
      </section>

      <!-- Reasoning Effort -->
      <section class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="effortTitle">思考深度（Reasoning Effort）</span>
          <span id="effort-hint" class="hint"></span>
        </div>
        <div id="effort-group" class="pill-grid" role="radiogroup" aria-label="Reasoning Effort"></div>
        <p id="effort-desc" class="helper"></p>
      </section>

      <!-- Progression Mode -->
      <section class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="progressionTitle">目标推进模式（Progression）</span>
          <span id="bind-badge" class="hint"></span>
        </div>
        <div id="progression-group" class="segment-row" role="radiogroup" aria-label="Progression Mode">
          <button type="button" class="seg-btn" data-progression="manual">
            <span class="seg-label" data-i18n="progManual">手动推进</span>
            <span class="seg-sub" data-i18n="progManualSub">干完不回调，等你指示</span>
          </button>
          <button type="button" class="seg-btn" data-progression="notify">
            <span class="seg-label" data-i18n="progNotify">完工自动验收</span>
            <span class="seg-sub" data-i18n="progNotifySub">后台跑完自动唤醒汇报</span>
          </button>
          <button type="button" class="seg-btn" data-progression="autonomous">
            <span class="seg-label" data-i18n="progAuto">持续自动推进</span>
            <span class="seg-sub" data-i18n="progAutoSub">自动验收→返工/下一步</span>
          </button>
        </div>
        <div class="inline-setting">
          <label for="max-iter-input" class="hint" data-i18n="maxIterLabel">自动推进轮次上限</label>
          <div class="inline-controls">
            <input id="max-iter-input" type="number" min="1" max="100" value="12" class="num-input" />
            <button id="btn-bind-conv" type="button" class="mini-btn" data-i18n="bindConvBtn">绑定当前对话</button>
          </div>
        </div>
      </section>

      <!-- Sandbox & Workflow -->
      <section class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="sandboxTitle">执行权限（Sandbox）与派活方式</span>
        </div>
        <div id="sandbox-group" class="segment-row" role="radiogroup" aria-label="Sandbox">
          <button type="button" class="seg-btn" data-sandbox="read-only">
            <span class="seg-label" data-i18n="sbReadOnly">只读分析</span>
            <span class="seg-sub">read-only</span>
          </button>
          <button type="button" class="seg-btn" data-sandbox="workspace-write">
            <span class="seg-label" data-i18n="sbWrite">工作区可写</span>
            <span class="seg-sub">workspace-write</span>
          </button>
          <button type="button" class="seg-btn" data-sandbox="danger-full-access">
            <span class="seg-label" data-i18n="sbFull">完全权限</span>
            <span class="seg-sub">full-access</span>
          </button>
        </div>
        <div id="workflow-group" class="segment-row two-col mt-8" role="radiogroup" aria-label="Workflow">
          <button type="button" class="seg-btn" data-workflow="direct">
            <span class="seg-label" data-i18n="wfDirect">直接派活执行</span>
            <span class="seg-sub" data-i18n="wfDirectSub">拆解后立即交给 Codex</span>
          </button>
          <button type="button" class="seg-btn" data-workflow="plan_first">
            <span class="seg-label" data-i18n="wfPlan">先出任务单确认</span>
            <span class="seg-sub" data-i18n="wfPlanSub">你点头后再启动 Codex</span>
          </button>
        </div>
        <div class="toggle-row">
          <label class="switch-label">
            <input id="toggle-ephemeral" type="checkbox" />
            <span data-i18n="ephemeralLabel">临时会话模式（不写入 Codex 历史会话）</span>
          </label>
          <button id="btn-reset" type="button" class="link-btn" data-i18n="resetBtn">恢复默认</button>
        </div>
      </section>

      <!-- Quick Dispatch -->
      <section class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="quickTitle">快捷派活给反重力 → Codex</span>
        </div>
        <textarea id="quick-task" rows="2" class="textarea" data-i18n-placeholder="quickPlaceholder" placeholder="描述你想让 Codex 持续排查、验证或修改的后端/Meta分析任务…"></textarea>
        <div class="action-row">
          <button id="btn-send-task" type="button" class="primary-btn" data-i18n="sendTaskBtn">发送任务给反重力</button>
          <button id="btn-check-status" type="button" class="secondary-btn" data-i18n="checkStatusBtn">对话自检</button>
        </div>
      </section>
    </main>

    <!-- TAB 2: GOALS & JOBS -->
    <main id="panel-goals" class="content hidden">
      <!-- Persistent Goal Board -->
      <section class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="goalBoardTitle">持久化目标板（Goal & Milestones）</span>
          <button id="btn-toggle-new-goal" type="button" class="mini-btn" data-i18n="newGoalBtn">+ 新建目标</button>
        </div>

        <form id="new-goal-form" class="goal-form hidden">
          <input id="goal-title" type="text" class="input" data-i18n-placeholder="goalTitlePlaceholder" placeholder="目标标题，例如：排查后端鉴权 500 报错并补全单测" required />
          <input id="goal-cwd" type="text" class="input" data-i18n-placeholder="goalCwdPlaceholder" placeholder="项目目录（可选，留空自动使用当前工作区）" />
          <textarea id="goal-milestones" rows="3" class="textarea" data-i18n-placeholder="goalMilestonesPlaceholder" placeholder="子里程碑（每行一条），例如：&#10;复现 500 错误并定位根因&#10;修复代码并跑通 pytest&#10;验证接口回归无副作用"></textarea>
          <div class="action-row">
            <button type="submit" class="primary-btn" data-i18n="createGoalBtn">创建并设为当前目标</button>
            <button id="btn-cancel-goal" type="button" class="secondary-btn" data-i18n="cancelBtn">取消</button>
          </div>
        </form>

        <div id="goal-selector-row" class="goal-selector hidden">
          <select id="goal-select" class="select"></select>
        </div>

        <div id="active-goal-view" class="goal-view">
          <div class="empty" data-i18n="emptyGoal">暂无持久化目标。点右上角「+ 新建目标」或直接在对话中让反重力创建目标板～</div>
        </div>
      </section>

      <!-- Live & Persisted Background Jobs -->
      <section class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="jobsTitle">后台 Codex 任务（断点可续接）</span>
          <span id="jobs-count" class="hint">0</span>
        </div>
        <div id="jobs-list" class="history-list">
          <div class="empty" data-i18n="emptyJobs">暂无后台任务记录。</div>
        </div>
      </section>

      <!-- Recent History -->
      <section class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="historyTitle">最近执行记录</span>
          <span id="history-count" class="hint">0</span>
        </div>
        <div id="history-list" class="history-list">
          <div class="empty" data-i18n="emptyHistory">还没有执行记录～</div>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
